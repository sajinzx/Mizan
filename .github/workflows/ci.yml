name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Also validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build (compile, Spotless, Error Prone, unit + short property tests, JaCoCo, checkModuleGraph)
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/"
          retention-days: 7
