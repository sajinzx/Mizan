name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: properties
            task: nightly
          - name: sim-sweep
            task: simSweep -Pseeds=1000
          - name: recovery
            task: recoveryTest -Piter=200
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --stacktrace
      - name: Upload reports and jqwik database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.name }}
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/jqwik-database
          retention-days: 14
